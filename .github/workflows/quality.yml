name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  php:
    name: PHP 8.5 lint and PHPUnit (SQLite fixtures)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      DATABASE_URL: ''
      CACHE_STORE: array
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
      MAIL_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      # Official release tags and their dereferenced commits verified 2026-10-29.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5.10'
          extensions: curl, dom, fileinfo, gd, intl, mbstring, pdo_sqlite, sqlite3, xml, xmlreader, xmlwriter, zip
          coverage: none
          tools: composer:2.10.3
      - name: Require a committed and consistent lockfile
        run: |
          git ls-files --error-unmatch composer.lock
          composer validate --strict --no-check-publish
      - name: PHP syntax
        run: git ls-files -z -- '*.php' ':!:*.blade.php' | xargs -0 -r -n 1 php -l
      - name: Install locked dependencies
        run: |
          mkdir -p bootstrap/cache storage/framework/{cache/data,sessions,views} storage/logs
          composer install --no-interaction --prefer-dist --optimize-autoloader
          composer check-platform-reqs
          composer dump-autoload --optimize --strict-psr --strict-ambiguous
          git diff --exit-code -- composer.json composer.lock
      - name: Focused task regressions (blocking)
        run: |
          mkdir -p reports/quality
          php vendor/bin/phpunit --do-not-cache-result --log-junit reports/quality/phpunit-focused.xml \
            tests/Feature/DepositoIntegrityTest.php \
            tests/Feature/ExpSettingsValidationTest.php \
            tests/Feature/JuiceCostAccountingTest.php \
            tests/Feature/ParcelFinalizationIntegrityTest.php \
            tests/Feature/ProductPriceValidationTest.php \
            tests/Feature/ProductVariantLifecycleTest.php \
            tests/Feature/ProductionInventoryIntegrityTest.php \
            tests/Feature/RouteIntegrityTest.php \
            tests/Unit/Php85CompatibilityTest.php \
            tests/Unit/PhpunitConfigurationTest.php \
            tests/Unit/InventoryMySqlWorkerGuardTest.php
      - name: Full PHPUnit (known baseline failures; informational)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          mkdir -p reports/quality
          php vendor/bin/phpunit --do-not-cache-result --log-junit reports/quality/phpunit-full.xml
      - name: Report locked PHP dependency advisories (non-blocking)
        if: ${{ always() }}
        continue-on-error: true
        run: |
          mkdir -p reports/quality
          composer audit --locked --format=json | tee reports/quality/composer-audit.json
      - name: Upload PHP evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php-quality-evidence
          path: reports/quality/
          if-no-files-found: error
          retention-days: 14

  mysql:
    name: MySQL 8.4 inventory concurrency
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        # Official mysql:8.4.11 multi-arch digest verified at registry-1.docker.io.
        image: mysql:8.4.11@sha256:0f51e63e537a1f176423fa03ef559aabe6fa4372a53160a44bc7e75da7d15364
        env:
          MYSQL_ROOT_PASSWORD: ci-infruity-only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      DATABASE_URL: ''
      CACHE_STORE: array
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
      MAIL_DRIVER: array
      QUEUE_CONNECTION: sync
      # Ephemeral service credentials, not application/business database secrets.
      # Integration tests must create/drop only their generated infruity_test_* schemas.
      INFRUITY_TEST_MYSQL_HOST: 127.0.0.1
      INFRUITY_TEST_MYSQL_PORT: '3306'
      INFRUITY_TEST_MYSQL_USERNAME: root
      INFRUITY_TEST_MYSQL_PASSWORD: ci-infruity-only
      INFRUITY_TEST_MYSQL_SOCKET: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5.10'
          extensions: curl, dom, fileinfo, gd, intl, mbstring, pdo_mysql, pdo_sqlite, sqlite3, xml, xmlreader, xmlwriter, zip
          coverage: none
          tools: composer:2.10.3
      - name: Install locked dependencies
        run: |
          git ls-files --error-unmatch composer.lock
          composer validate --strict --no-check-publish
          mkdir -p bootstrap/cache storage/framework/{cache/data,sessions,views} storage/logs
          composer install --no-interaction --prefer-dist --optimize-autoloader
          composer check-platform-reqs
          git diff --exit-code -- composer.json composer.lock
      - name: Real MySQL inventory concurrency tests
        # Parent-owned acceptance test: a missing class is a hard failure, never a skip.
        run: |
          test -f tests/Integration/InventoryConcurrencyTest.php
          mkdir -p reports/quality
          php vendor/bin/phpunit tests/Integration/InventoryConcurrencyTest.php --do-not-cache-result --log-junit reports/quality/mysql.xml
      - name: Upload MySQL evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mysql-quality-evidence
          path: reports/quality/
          if-no-files-found: error
          retention-days: 14

  node:
    name: Node tests and locked legacy Mix build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Supported LTS runtime, verified against nodejs.org/dist/index.json.
          node-version: '22.23.4'
          package-manager-cache: false
      - name: JavaScript syntax and unit tests
        run: |
          node --check resources/js/app.js
          node --check resources/js/bootstrap.js
          node --test tests/js/*.test.cjs
      - name: Install locked frontend dependencies
        run: |
          npm ci --no-fund
          git diff --exit-code -- package.json package-lock.json
      - name: Legacy production build
        # Webpack 4 in Mix 5 needs the legacy provider on OpenSSL 3 runtimes.
        # Limit this compatibility setting to this build, not tests or audits.
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          npm run production -- --env.mixfile=scripts/quality-webpack.mix.js
          test -s public/js/app.js
          test -s public/css/app.css
          test -s public/mix-manifest.json
          git diff --exit-code -- package.json package-lock.json
      - name: Report locked frontend dependency advisories (non-blocking)
        if: ${{ always() }}
        continue-on-error: true
        run: |
          mkdir -p reports/quality
          npm audit --json | tee reports/quality/npm-audit.json
      - name: Upload frontend evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-quality-evidence
          path: |
            reports/quality/
            public/mix-manifest.json
          if-no-files-found: error
          retention-days: 14
