<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Referensi Desain 2 Card Terpisah | Infruity ERP</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            DEFAULT: '#0b595b',
                            dark: '#08484a',
                            light: '#e6f3f3',
                            accent: '#10b981'
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace']
                    },
                    boxShadow: {
                        '2xs': '0 1px 2px 0 rgba(0, 0, 0, 0.05)',
                        'card': '0 2px 8px -2px rgba(0, 0, 0, 0.05), 0 1px 4px -1px rgba(0, 0, 0, 0.03)'
                    }
                }
            }
        };
    </script>
    <style>
        [x-cloak] { display: none !important; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .custom-card-scroll::-webkit-scrollbar { width: 5px; }
        .custom-card-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-card-scroll::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.12); border-radius: 10px; }
        .custom-card-scroll::-webkit-scrollbar-thumb:hover { background: rgba(11, 89, 91, 0.35); }
        .custom-card-scroll { scrollbar-width: thin; scrollbar-color: rgba(0, 0, 0, 0.12) transparent; }

        /* Minimalist Dropdown Scrollbar (Dashboard Style) */
        .minimal-scrollbar::-webkit-scrollbar { width: 3px; }
        .minimal-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .minimal-scrollbar::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 3px; }
        .minimal-scrollbar::-webkit-scrollbar-thumb:hover { background: #d1d5db; }
    </style>
</head>
<body class="bg-slate-100 text-gray-800 font-sans antialiased selection:bg-emerald-500 selection:text-white min-h-screen flex flex-col"
      x-data="{
          // Mode Variasi Desain 2 Card
          cardStyle: 'pure', // 'pure' (Opsi B - Terpilih), 'shaded' (Opsi A), 'compact' (Opsi C)
          
          // Profil Pengguna & Cabang Hak Akses
          currentUser: {
              name: 'Dimas Pratama',
              role: 'Admin Cabang',
              branches: [
                  'Surabaya / Rungkut - 001',
                  'Gresik / Driyorejo - 001',
                  'Sidoarjo / Waru - 001'
              ]
          },

          // Form State
          form: {
              targetBranch: '', // Diisi otomatis saat init()
              items: [] // Dimulai dengan kondisi kosong sesuai screenshot
          },

          // Daftar Cabang Aktif (Diurutkan Abjad A-Z)
          branches: [],

          init() {
              this.initBranchDefault();
          },

          // Inisialisasi default cabang user (jika 2+ cabang, default sesuai abjad teratas)
          initBranchDefault() {
              let userBranches = [...(this.currentUser.branches || [])];
              try {
                  const storedUser = localStorage.getItem('infruity_current_user');
                  if (storedUser) {
                      const parsed = JSON.parse(storedUser);
                      if (parsed.branches && Array.isArray(parsed.branches) && parsed.branches.length > 0) {
                          userBranches = [...parsed.branches];
                      }
                  }
              } catch (e) {}

              if (!userBranches || userBranches.length === 0) {
                  userBranches = [
                      'Gresik / Driyorejo - 001',
                      'Surabaya / Rungkut - 001',
                      'Surabaya / Rungkut - 002',
                      'Surabaya / Barat - 001',
                      'Sidoarjo / Waru - 001',
                      'Malang / Klojen - 001'
                  ];
              }

              // Urutkan alfabetis (A-Z)
              this.branches = userBranches.sort((a, b) => a.localeCompare('id', { sensitivity: 'base' }));

              // Set default: cabang pertama sesuai abjad
              const urlParams = new URLSearchParams(window.location.search);
              const queryBranch = urlParams.get('branch');
              if (queryBranch && this.branches.includes(queryBranch)) {
                  this.form.targetBranch = queryBranch;
              } else if (this.branches.length > 0) {
                  this.form.targetBranch = this.branches[0];
              }
          },

          // Preset Data untuk Simulasi
          defaultSampleItems: [
              { name: 'Buah Naga Merah', qty: 100, unit: 'Kg', buyPrice: 18000 },
              { name: 'Alpukat Mentega Super', qty: 25, unit: 'Kg', buyPrice: 26000 }
          ],

          // Modal State
          itemModalOpen: false,
          confirmModalOpen: false,
          modalMode: 'add',
          editingIndex: null,
          modalItem: {
              productId: null,
              name: '',
              unit: '',
              buyPrice: null,
              sellPrice: null,
              marginPercent: null,
              qty: null
          },

          // Quick Master Data (dengan Harga Jual)
          masterItems: [
              { id: 1, name: 'Buah Naga Merah', unit: 'Kg', buyPrice: 18000, sellPrice: 24000 },
              { id: 2, name: 'Alpukat Mentega Super', unit: 'Kg', buyPrice: 26000, sellPrice: 35000 },
              { id: 3, name: 'Jeruk Sunkist Impor', unit: 'Kg', buyPrice: 32000, sellPrice: 42000 },
              { id: 4, name: 'Melon Sky Rocket', unit: 'Kg', buyPrice: 14000, sellPrice: 20000 },
              { id: 5, name: 'Semangka Non Biji', unit: 'Kg', buyPrice: 8500, sellPrice: 12000 }
          ],

          // Helper Calculations
          calculateGrandTotal() {
              return this.form.items.reduce((acc, item) => acc + ((item.qty || 0) * (item.buyPrice || 0)), 0);
          },

          // Modal Actions
          openAddItemModal() {
              this.modalMode = 'add';
              this.editingIndex = null;
              this.modalItem = {
                  productId: null,
                  name: '',
                  unit: '',
                  buyPrice: null,
                  sellPrice: null,
                  marginPercent: null,
                  qty: null
              };
              this.itemModalOpen = true;
          },

          openEditItemModal(idx) {
              this.modalMode = 'edit';
              this.editingIndex = idx;
              this.modalItem = { ...this.form.items[idx] };
              this.updateModalMargin();
              this.itemModalOpen = true;
          },

          selectModalProduct(item) {
              this.modalItem.productId = item.id;
              this.modalItem.name = item.name;
              this.modalItem.unit = item.unit;
              this.modalItem.buyPrice = item.buyPrice;
              this.modalItem.sellPrice = item.sellPrice;
              if (!this.modalItem.qty || this.modalItem.qty <= 0) {
                  this.modalItem.qty = 1;
              }
              this.updateModalMargin();
          },

          // Format angka rupiah ribuan (misal: 1000000 -> 1.000.000)
          formatRupiahInput(val) {
              if (val === null || val === undefined || val === '') return '';
              const num = typeof val === 'number' ? val : parseInt(String(val).replace(/\D/g, ''), 10);
              return isNaN(num) || num === 0 ? '' : num.toLocaleString('id-ID');
          },

          // Handle input harga dengan format titik ribuan otomatis saat mengetik
          handlePriceInput(field, event) {
              const raw = event.target.value.replace(/\D/g, '');
              const num = raw ? parseInt(raw, 10) : 0;
              this.modalItem[field] = num;
              event.target.value = num > 0 ? num.toLocaleString('id-ID') : '';
              this.updateModalMargin();
          },

          // Hitung otomatis Margin (%)
          updateModalMargin() {
              const buy = this.modalItem.buyPrice || 0;
              const sell = this.modalItem.sellPrice || 0;
              if (sell > 0) {
                  this.modalItem.marginPercent = Number((((sell - buy) / sell) * 100).toFixed(1));
              } else {
                  this.modalItem.marginPercent = 0;
              }
          },

          saveModalItem() {
              if (!this.modalItem.name) {
                  alert('Silakan pilih produk / bahan terlebih dahulu');
                  return;
              }
              if (!this.modalItem.qty || this.modalItem.qty <= 0) {
                  alert('Silakan masukkan kuantitas');
                  return;
              }
              if (this.modalItem.buyPrice === null || this.modalItem.buyPrice === undefined || this.modalItem.buyPrice === '') {
                  alert('Silakan masukkan harga beli / satuan');
                  return;
              }

              // Sinkronisasi perubahan harga ke master data
              if (this.modalItem.productId) {
                  const targetProd = this.masterItems.find(p => p.id === this.modalItem.productId);
                  if (targetProd) {
                      targetProd.sellPrice = this.modalItem.sellPrice;
                      if (this.modalItem.buyPrice) targetProd.buyPrice = this.modalItem.buyPrice;
                  }
              }

              if (this.modalMode === 'add') {
                  this.form.items.push({ ...this.modalItem });

                  // Reset input modal (modal tetap terbuka / stay)
                  this.modalItem = {
                      productId: null,
                      name: '',
                      unit: '',
                      qty: null,
                      buyPrice: null,
                      sellPrice: null,
                      marginPercent: null
                  };
              } else if (this.editingIndex !== null) {
                  this.form.items[this.editingIndex] = { ...this.modalItem };
                  this.itemModalOpen = false;
              }
          },

          deleteEditingItem() {
              if (this.editingIndex !== null) {
                  this.form.items.splice(this.editingIndex, 1);
              }
              this.itemModalOpen = false;
          },

          // Toggle Antara State Kosong & Terisi
          toggleDataState() {
              if (this.form.items.length === 0) {
                  this.form.items = JSON.parse(JSON.stringify(this.defaultSampleItems));
              } else {
                  this.form.items = [];
              }
          },

          navigateBack(e) {
              if (e && e.preventDefault) e.preventDefault();
              if (window.self !== window.top) {
                  window.parent.postMessage({
                      type: 'navigate',
                      page: '003. Pembelian/001. Pengadaan/index.html',
                      menu: 'pembelian'
                  }, '*');
              } else {
                  window.location.href = 'index.html';
              }
          },

          // Simpan draf: tanpa alert, langsung kembali ke halaman utama pengadaan
          saveDraft() {
              if (this.form.items && this.form.items.length > 0) {
                  try {
                      const stored = localStorage.getItem('infruity_pengadaan_orders');
                      let orders = stored ? JSON.parse(stored) : [];
                      if (!Array.isArray(orders)) orders = [];

                      const grandTotal = this.calculateGrandTotal();
                      const today = new Date();
                      const dateStr = today.toISOString().split('T')[0];
                      const timeStr = String(today.getHours()).padStart(2, '0') + ':' + String(today.getMinutes()).padStart(2, '0');

                      const newDraft = {
                          id: 'draft-' + Date.now(),
                          poNumber: 'PO-DRAFT-' + String(Math.floor(1000 + Math.random() * 9000)),
                          staffName: this.currentUser?.name || 'Dimas Pratama',
                          staffInitial: 'DP',
                          staffTheme: 'bg-emerald-50 text-[#0b595b] border-emerald-200',
                          supplierName: 'PT Buah Segar Nusantara',
                          supplierPhone: '0812-3456-7890',
                          supplierCity: 'Surabaya',
                          supplierInitial: 'BS',
                          supplierTheme: 'bg-emerald-50 text-emerald-700 border-emerald-200',
                          targetBranch: this.form.targetBranch,
                          date: dateStr,
                          time: timeStr,
                          eta: dateStr,
                          items: [...this.form.items],
                          subtotal: grandTotal,
                          shippingFee: 0,
                          grandTotal: grandTotal,
                          status: 'Draft',
                          paymentStatus: 'Belum Bayar',
                          paymentMethod: 'Transfer Bank (BCA)'
                      };
                      orders.unshift(newDraft);
                      localStorage.setItem('infruity_pengadaan_orders', JSON.stringify(orders));
                  } catch (err) {
                      console.error('Gagal menyimpan draf:', err);
                  }
              }

              this.navigateBack();
          },

          openConfirmModal() {
              if (this.form.items.length === 0) {
                  alert('Silakan tambahkan minimal 1 item belanja terlebih dahulu.');
                  return;
              }
              this.confirmModalOpen = true;
          },

          submitPengadaan() {
              this.openConfirmModal();
          },

          executeSubmitPengadaan() {
              try {
                  const stored = localStorage.getItem('infruity_pengadaan_orders');
                  let orders = stored ? JSON.parse(stored) : [];
                  if (!Array.isArray(orders)) orders = [];

                  const grandTotal = this.calculateGrandTotal();
                  const today = new Date();
                  const dateStr = today.toISOString().split('T')[0];
                  const timeStr = String(today.getHours()).padStart(2, '0') + ':' + String(today.getMinutes()).padStart(2, '0');

                  const newOrder = {
                      id: 'po-' + Date.now(),
                      poNumber: 'PO-' + today.getFullYear() + '-' + String(Math.floor(1000 + Math.random() * 9000)),
                      staffName: this.currentUser?.name || 'Dimas Pratama',
                      staffInitial: 'DP',
                      staffTheme: 'bg-emerald-50 text-[#0b595b] border-emerald-200',
                      supplierName: 'PT Buah Segar Nusantara',
                      supplierPhone: '0812-3456-7890',
                      supplierCity: 'Surabaya',
                      supplierInitial: 'BS',
                      supplierTheme: 'bg-emerald-50 text-emerald-700 border-emerald-200',
                      targetBranch: this.form.targetBranch,
                      date: dateStr,
                      time: timeStr,
                      eta: dateStr,
                      items: [...this.form.items],
                      subtotal: grandTotal,
                      shippingFee: 0,
                      grandTotal: grandTotal,
                      status: 'Selesai',
                      paymentStatus: 'Lunas',
                      paymentMethod: 'Transfer Bank (BCA)'
                  };
                  orders.unshift(newOrder);
                  localStorage.setItem('infruity_pengadaan_orders', JSON.stringify(orders));
              } catch (err) {
                  console.error('Gagal menyimpan transaksi:', err);
              }

              this.confirmModalOpen = false;
              this.navigateBack();
          }
      }">

    <!-- ======================================================== -->
    <!-- TOP TOOLBAR SIMULATOR (PENGATUR OPSI & SIMULASI DATA)    -->
    <!-- ======================================================== -->
    <header class="bg-white border-b border-gray-300 shrink-0 sticky top-0 z-50 shadow-2xs">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 py-2.5 flex flex-col md:flex-row md:items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <a href="tambah.html" class="p-2 rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-700 transition" title="Kembali ke tambah.html">
                    <i class="ph-bold ph-arrow-left text-base"></i>
                </a>
                <div>
                    <div class="flex items-center gap-2">
                        <span class="text-[11px] font-extrabold uppercase tracking-wider text-emerald-800 bg-emerald-100 px-2 py-0.5 rounded">
                            2 Card Terpisah
                        </span>
                        <h1 class="text-sm sm:text-base font-extrabold text-gray-900 leading-tight">
                            Desain Card Cabang & Card Daftar Belanja
                        </h1>
                    </div>
                </div>
            </div>

            <!-- Kontrol Interaktif Simulasi -->
            <div class="flex items-center gap-2 overflow-x-auto scrollbar-hide shrink-0 pb-1 md:pb-0">
                <!-- Toggle State: Kosong vs Terisi -->
                <button @click="toggleDataState()"
                        :class="form.items.length === 0 ? 'bg-amber-100 text-amber-900 border-amber-300' : 'bg-emerald-100 text-emerald-900 border-emerald-300'"
                        class="px-3 py-1.5 rounded-lg text-xs font-bold border transition flex items-center gap-1.5 shadow-2xs">
                    <span class="w-2 h-2 rounded-full" :class="form.items.length === 0 ? 'bg-amber-500' : 'bg-emerald-600'"></span>
                    <span x-text="form.items.length === 0 ? 'Mode: Kosong (Klik isi item)' : 'Mode: Terisi (Klik kosongkan)'"></span>
                </button>

                <div class="h-5 w-px bg-gray-300 mx-1 shrink-0"></div>

                <!-- Pilihan Style Card -->
                <div class="flex bg-gray-100 p-0.5 rounded-lg border border-gray-200 text-xs font-semibold">
                    <button @click="cardStyle = 'shaded'"
                            :class="cardStyle === 'shaded' ? 'bg-white text-gray-900 shadow-2xs font-bold' : 'text-gray-600 hover:text-gray-900'"
                            class="px-2.5 py-1 rounded-md transition">
                        Opsi A: Shaded Bar (Sesuai Acuan)
                    </button>
                    <button @click="cardStyle = 'pure'"
                            :class="cardStyle === 'pure' ? 'bg-white text-gray-900 shadow-2xs font-bold' : 'text-gray-600 hover:text-gray-900'"
                            class="px-2.5 py-1 rounded-md transition">
                        Opsi B: Pure Minimalist
                    </button>
                    <button @click="cardStyle = 'compact'"
                            :class="cardStyle === 'compact' ? 'bg-white text-gray-900 shadow-2xs font-bold' : 'text-gray-600 hover:text-gray-900'"
                            class="px-2.5 py-1 rounded-md transition">
                        Opsi C: In-Card Total
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- ======================================================== -->
    <!-- MAIN SIMULATOR KANVAS LAYAR FORM PENGADAAN               -->
    <!-- ======================================================== -->
    <div class="flex-1 flex flex-col justify-between py-6 px-4 sm:px-6 max-w-4xl w-full mx-auto">

        <!-- KONTEN FORM 2 CARD TERPISAH -->
        <div class="space-y-6 flex-1 flex flex-col">

            <!-- ======================================================== -->
            <!-- CARD 1: CABANG PENERIMA (KARTU TERPISAH 1 - CUSTOM DROPDOWN PRODUK) -->
            <!-- ======================================================== -->
            <div class="bg-white rounded-2xl border border-gray-200/90 shadow-card p-4 sm:p-5 transition-all relative z-40 shrink-0"
                 x-data="{ branchOpen: false }">
                <label class="text-xs font-bold text-gray-700 mb-1.5 flex items-center gap-1.5">
                    <span>Cabang</span>
                    <span class="text-red-500">*</span>
                </label>
                <div class="relative">
                    <!-- Trigger Button Kustom -->
                    <button type="button" @click="branchOpen = !branchOpen"
                            class="w-full h-11 bg-gray-50/70 hover:bg-gray-50 focus:bg-white border border-gray-200 rounded-xl px-4 flex items-center justify-between text-sm font-semibold text-gray-800 outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition cursor-pointer shadow-2xs text-left group">
                        <span class="truncate pr-2" x-text="form.targetBranch || 'Pilih Cabang'"></span>
                        <i class="ph-bold ph-caret-down text-gray-400 group-hover:text-gray-600 text-sm shrink-0 transition-transform duration-200"
                           :class="branchOpen ? 'rotate-180 text-[#0b595b]' : ''"></i>
                    </button>

                    <!-- Dropdown Menu Mengambang (Gaya Bersih Sesuai Dashboard) -->
                    <div x-show="branchOpen" @click.outside="branchOpen = false" x-cloak
                         x-transition:enter="transition ease-out duration-100"
                         x-transition:enter-start="opacity-0 scale-95"
                         x-transition:enter-end="opacity-100 scale-100"
                         x-transition:leave="transition ease-in duration-75"
                         x-transition:leave-start="opacity-100 scale-100"
                         x-transition:leave-end="opacity-0 scale-95"
                         class="absolute top-full mt-1.5 left-0 w-full bg-white border border-gray-100 rounded-xl shadow-lg py-1 z-50 max-h-56 overflow-y-auto overscroll-none minimal-scrollbar">
                         <template x-for="branch in branches" :key="branch">
                             <div @click="form.targetBranch = branch; branchOpen = false"
                                  class="px-3.5 py-2.5 text-xs sm:text-[13px] cursor-pointer transition-colors flex justify-between items-center group"
                                  :class="form.targetBranch === branch ? 'bg-gray-50 text-emerald-600 font-semibold' : 'text-gray-700 font-medium hover:bg-gray-50'">
                                 <span x-text="branch"></span>
                                 <i class="ph-fill ph-circle text-[8px] text-emerald-500" x-show="form.targetBranch === branch"></i>
                             </div>
                         </template>
                    </div>
                </div>
            </div>

            <!-- ======================================================== -->
            <!-- CARD 2: DAFTAR BELANJA (KARTU TERPISAH 2)                -->
            <!-- ======================================================== -->
            <div class="bg-white rounded-2xl border border-gray-200/90 shadow-card overflow-hidden flex-1 min-h-[220px] flex flex-col transition-all">

                <!-- ---------------------------------------------------- -->
                <!-- HEADER CARD 2: VARIASI A (SHADED BAR ABU-ABU)        -->
                <!-- ---------------------------------------------------- -->
                <template x-if="cardStyle === 'shaded'">
                    <div class="bg-gray-100/90 border-b border-gray-200 px-5 sm:px-6 py-3.5 flex items-center justify-between shrink-0">
                        <div>
                            <span class="text-xs sm:text-sm font-bold text-gray-800">Daftar Belanja</span>
                        </div>
                        <button type="button" @click="openAddItemModal()"
                                class="text-xs font-bold text-[#0b595b] hover:text-[#08484a] flex items-center gap-1 bg-white hover:bg-gray-50 px-3.5 py-1.5 rounded-lg border border-gray-300 transition shadow-2xs active:scale-95">
                            <span>+ Tambah Item</span>
                        </button>
                    </div>
                </template>

                <!-- ---------------------------------------------------- -->
                <!-- HEADER CARD 2: VARIASI B (PURE MINIMALIST WHITE)     -->
                <!-- ---------------------------------------------------- -->
                <template x-if="cardStyle === 'pure'">
                    <div class="bg-white border-b border-gray-100 px-5 sm:px-6 py-4 flex items-center justify-between shrink-0">
                        <div>
                            <span class="text-sm font-extrabold text-gray-900 tracking-tight">Daftar Belanja</span>
                        </div>
                        <button type="button" @click="openAddItemModal()"
                                class="text-xs font-bold text-[#0b595b] hover:text-[#08484a] flex items-center gap-1 bg-emerald-50/80 hover:bg-emerald-100/80 px-3.5 py-1.5 rounded-lg border border-emerald-200/80 transition shadow-2xs active:scale-95">
                            <span>+ Tambah Item</span>
                        </button>
                    </div>
                </template>

                <!-- ---------------------------------------------------- -->
                <!-- HEADER CARD 2: VARIASI C (CLEAN SUB-HEADER)          -->
                <!-- ---------------------------------------------------- -->
                <template x-if="cardStyle === 'compact'">
                    <div class="bg-gray-50/80 border-b border-gray-200/80 px-5 sm:px-6 py-3.5 flex items-center justify-between shrink-0">
                        <div class="flex items-center gap-2">
                            <span class="text-xs sm:text-sm font-bold text-gray-800">Daftar Belanja</span>
                            <span x-show="form.items.length > 0" class="bg-emerald-100 text-[#0b595b] text-[11px] font-extrabold px-2 py-0.5 rounded-full"
                                  x-text="form.items.length"></span>
                        </div>
                        <button type="button" @click="openAddItemModal()"
                                class="text-xs font-bold text-[#0b595b] hover:text-[#08484a] flex items-center gap-1 bg-white hover:bg-gray-50 px-3.5 py-1.5 rounded-lg border border-gray-300 transition shadow-2xs active:scale-95">
                            <span>+ Tambah Item</span>
                        </button>
                    </div>
                </template>

                <!-- ---------------------------------------------------- -->
                <!-- BODY CARD 2: KONTEN LIST ATAU EMPTY STATE            -->
                <!-- ---------------------------------------------------- -->
                <div class="flex-1 min-h-0 overflow-y-auto p-4 sm:p-6 custom-card-scroll">

                    <!-- STATE 1: EMPTY STATE (KETIKA DAFTAR KOSONG - PERSIS SEPERTI GAMBAR ACUAN) -->
                    <div x-show="form.items.length === 0" class="h-full flex flex-col items-center justify-center text-center p-6 my-auto min-h-[200px]">
                        <h3 class="text-sm sm:text-base font-bold text-gray-800">
                            Belum ada produk didaftar belanja
                        </h3>
                        <p class="text-xs sm:text-sm text-gray-500 mt-1.5">
                            Klik tombol <button type="button" @click="openAddItemModal()" class="font-semibold text-[#0b595b] hover:underline inline-flex items-center gap-0.5">+ Tambah</button> untuk melakukan input
                        </p>
                    </div>

                    <!-- STATE 2: LIST PRODUK TERISI (2 BARIS SESUAI INSTRUKSI TERAKHIR) -->
                    <div x-show="form.items.length > 0">
                        <template x-for="(item, idx) in form.items" :key="idx">
                            <div @click="openEditItemModal(idx)"
                                 :class="idx === 0 ? 'pt-1 pb-3' : 'border-t border-gray-100 py-3'"
                                 class="flex flex-col justify-center gap-1 cursor-pointer hover:bg-gray-50/80 -mx-2 px-2.5 rounded-lg transition-colors group">
                                <!-- BARIS 1: Nama Produk (Kiri) & Total Belanja (Kanan) -->
                                <div class="flex items-center justify-between gap-2">
                                    <h4 class="text-sm font-bold text-gray-900 truncate group-hover:text-[#0b595b] transition-colors" x-text="item.name"></h4>
                                    <span class="text-xs sm:text-sm font-extrabold text-[#0b595b] shrink-0" 
                                          x-text="'Rp ' + ((item.qty || 0) * (item.buyPrice || 0)).toLocaleString('id-ID')"></span>
                                </div>
                                
                                <!-- BARIS 2: Harga Satuan (Kiri - bawah produk) & Kuantitas (Kanan - bawah total) -->
                                <div class="flex items-center justify-between gap-2 mt-0.5">
                                    <span class="text-xs font-medium text-gray-500" 
                                          x-text="'Rp ' + (item.buyPrice || 0).toLocaleString('id-ID') + ' / ' + (item.unit || 'Kg')"></span>
                                    <span class="text-xs font-semibold text-gray-600 shrink-0 text-right" 
                                          x-text="((item.qty || 0).toLocaleString('id-ID')) + ' ' + (item.unit || 'Kg')"></span>
                                </div>
                            </div>
                        </template>
                    </div>

                </div>

                <!-- ---------------------------------------------------- -->
                <!-- FOOTER DALAM CARD UNTUK OPSI C (IN-CARD SUMMARY)     -->
                <!-- ---------------------------------------------------- -->
                <div x-show="cardStyle === 'compact' && form.items.length > 0"
                     class="bg-gray-50/90 border-t border-gray-200/80 px-5 sm:px-6 py-3.5 flex items-center justify-between">
                    <div class="flex items-center gap-2.5">
                        <span class="text-sm sm:text-base font-extrabold text-gray-900 leading-tight">Total Belanja</span>
                        <span class="w-6 h-6 aspect-square rounded-full bg-emerald-100 text-[#0b595b] text-xs font-extrabold flex items-center justify-center shrink-0 leading-none shadow-2xs"
                              x-text="form.items.length"></span>
                    </div>
                    <div class="text-right">
                        <span class="text-sm sm:text-base font-extrabold text-[#0b595b]"
                              x-text="'Rp ' + calculateGrandTotal().toLocaleString('id-ID')"></span>
                    </div>
                </div>

            </div>

        </div>

        <!-- ======================================================== -->
        <!-- BOTTOM HEADER (DOCKING RAPAT KE BAWAH - SESUAI SCREENSHOT) -->
        <!-- ======================================================== -->
        <div class="mt-auto shrink-0 bg-white border-t border-gray-100 px-4 sm:px-6 pt-3.5 pb-4 -mx-4 sm:-mx-6 shadow-[0_-4px_20px_rgba(0,0,0,0.03)]">
            <div class="max-w-4xl mx-auto">
                <!-- Row Total Belanja -->
                <div x-show="cardStyle !== 'compact'" class="flex items-center justify-between pb-3.5 border-b border-gray-100">
                    <div class="flex items-center gap-2">
                        <span class="text-base sm:text-lg font-extrabold text-gray-900 leading-tight">Total Belanja</span>
                        <span class="px-2.5 py-0.5 rounded-full text-xs font-extrabold bg-[#d1fae5] text-[#065f46] leading-tight"
                              x-text="form.items.length"></span>
                    </div>
                    <div class="text-right">
                        <span class="text-base sm:text-lg font-extrabold text-[#0b595b] leading-tight"
                              x-text="'Rp ' + calculateGrandTotal().toLocaleString('id-ID')"></span>
                    </div>
                </div>

                <!-- Tombol Aksi Bawah (2 Tombol: Simpan Draf & Selesaikan Transaksi) -->
                <div class="flex items-center gap-3 pt-3.5">
                    <button type="button" @click="saveDraft()"
                            class="flex-1 h-11 px-3 sm:px-6 rounded-xl border border-gray-200 bg-white hover:bg-gray-50 text-gray-800 text-xs sm:text-sm font-bold shadow-2xs transition active:scale-95 flex items-center justify-center">
                        Simpan sebagai Draf
                    </button>
                    <button type="button" @click="openConfirmModal()"
                            class="flex-1 h-11 px-3 sm:px-7 rounded-xl bg-[#0b595b] hover:bg-[#08484a] text-white text-xs sm:text-sm font-bold shadow-md shadow-[#0b595b]/15 transition active:scale-95 flex items-center justify-center">
                        Selesaikan Transaksi
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- ======================================================== -->
    <!-- MODAL TAMBAH / EDIT ITEM PRODUK (LENGKAP BERFUNGSI)      -->
    <!-- ======================================================== -->
    <div x-show="itemModalOpen" x-cloak
         @click.self="itemModalOpen = false"
         class="fixed inset-0 z-50 overflow-y-auto flex items-center justify-center p-4 bg-black/40 backdrop-blur-xs">
        
        <div @click.outside="itemModalOpen = false"
             x-transition:enter="transition ease-out duration-200"
             x-transition:enter-start="opacity-0 scale-95"
             x-transition:enter-end="opacity-100 scale-100"
             class="bg-white rounded-3xl max-w-md w-full shadow-2xl border border-gray-200 overflow-hidden">
            
            <!-- Modal Header -->
            <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between bg-gray-50/70">
                <h3 class="text-sm font-bold text-gray-900" x-text="modalMode === 'add' ? 'Tambah Item Belanja' : 'Edit Item Belanja'"></h3>
                <button type="button" @click="itemModalOpen = false" class="text-gray-400 hover:text-gray-700 text-sm font-bold p-1">
                    ✕
                </button>
            </div>

            <!-- Modal Body Form -->
            <div class="p-6 space-y-4">
                <!-- Pilih Bahan (Gaya Dashboard Dropdown Kustom) -->
                <div class="relative z-30" x-data="{ prodOpen: false }">
                    <label class="text-xs font-bold text-gray-700 mb-1.5 flex items-center gap-1.5">
                        <span>Nama Produk / Bahan</span>
                        <span class="text-red-500">*</span>
                    </label>
                    <div class="relative">
                        <!-- Trigger Button Kustom -->
                        <button type="button" @click="prodOpen = !prodOpen"
                                class="w-full h-10 bg-gray-50/70 hover:bg-gray-50 focus:bg-white border border-gray-200 rounded-xl px-3.5 flex items-center justify-between text-xs outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition cursor-pointer shadow-2xs text-left group">
                            <span class="truncate pr-2" :class="modalItem.name ? 'text-gray-800 font-semibold' : 'text-gray-400 font-normal'"
                                  x-text="modalItem.name ? modalItem.name + (modalItem.unit ? ' (' + modalItem.unit + ')' : '') : 'Pilih Produk / Bahan'"></span>
                            <i class="ph-bold ph-caret-down text-gray-400 group-hover:text-gray-600 text-xs shrink-0 transition-transform duration-200"
                               :class="prodOpen ? 'rotate-180 text-[#0b595b]' : ''"></i>
                        </button>

                        <!-- Dropdown Menu Mengambang (Gaya Bersih Sesuai Dashboard) -->
                        <div x-show="prodOpen" @click.outside="prodOpen = false" x-cloak
                             x-transition:enter="transition ease-out duration-100"
                             x-transition:enter-start="opacity-0 scale-95"
                             x-transition:enter-end="opacity-100 scale-100"
                             x-transition:leave="transition ease-in duration-75"
                             x-transition:leave-start="opacity-100 scale-100"
                             x-transition:leave-end="opacity-0 scale-95"
                             class="absolute top-full mt-1.5 left-0 w-full bg-white border border-gray-100 rounded-xl shadow-xl py-1 z-50 max-h-52 overflow-y-auto overscroll-none minimal-scrollbar">
                             <template x-for="item in masterItems" :key="item.name">
                                 <div @click="selectModalProduct(item); prodOpen = false"
                                      class="px-3.5 py-2.5 text-xs cursor-pointer transition-colors flex justify-between items-center group"
                                      :class="modalItem.name === item.name ? 'bg-emerald-50/70 text-emerald-700 font-semibold' : 'text-gray-700 font-medium hover:bg-gray-50'">
                                     <span x-text="item.name + (item.unit ? ' (' + item.unit + ')' : '')"></span>
                                     <i class="ph-fill ph-circle text-[8px] text-emerald-500" x-show="modalItem.name === item.name"></i>
                                 </div>
                             </template>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <!-- Kuantitas (Auto Format Titik Ribuan) -->
                    <div>
                        <label class="text-xs font-bold text-gray-700 mb-1.5 block">
                            Kuantitas <span class="text-gray-400 font-normal" x-show="modalItem.unit" x-text="'(' + modalItem.unit + ')'"></span>
                        </label>
                        <input type="text" inputmode="numeric"
                               :value="formatRupiahInput(modalItem.qty)"
                               @input="handlePriceInput('qty', $event)"
                               placeholder="0"
                               class="w-full h-10 px-3 bg-gray-50 border border-gray-200 rounded-xl text-xs font-bold text-gray-800 outline-none focus:border-emerald-500 placeholder:text-gray-300 placeholder:font-normal">
                    </div>

                    <!-- Harga Beli Satuan (Auto Format Titik Ribuan) -->
                    <div>
                        <label class="text-xs font-bold text-gray-700 mb-1.5 block">Harga Beli / Satuan</label>
                        <input type="text" inputmode="numeric"
                               :value="formatRupiahInput(modalItem.buyPrice)"
                               @input="handlePriceInput('buyPrice', $event)"
                               placeholder="0"
                               class="w-full h-10 px-3 bg-gray-50 border border-gray-200 rounded-xl text-xs font-bold text-gray-800 outline-none focus:border-emerald-500 placeholder:text-gray-300 placeholder:font-normal">
                    </div>
                </div>

                <!-- Baris Harga Jual & Margin (%) Berdampingan -->
                <div class="grid grid-cols-2 gap-3">
                    <!-- Harga Jual (Auto Format Titik Ribuan) -->
                    <div>
                        <label class="text-xs font-bold text-gray-700 mb-1.5 block">Harga Jual</label>
                        <input type="text" inputmode="numeric"
                               :value="formatRupiahInput(modalItem.sellPrice)"
                               @input="handlePriceInput('sellPrice', $event)"
                               placeholder="0"
                               class="w-full h-10 px-3 bg-gray-50 border border-gray-200 rounded-xl text-xs font-bold text-gray-800 outline-none focus:border-emerald-500 placeholder:text-gray-300 placeholder:font-normal">
                    </div>

                    <!-- Margin (%) Disamping Harga Jual (Otomatis & Readonly) -->
                    <div>
                        <label class="text-xs font-bold text-gray-700 mb-1.5 block">Margin (%)</label>
                        <input type="text" readonly
                               :value="modalItem.marginPercent !== null && modalItem.marginPercent !== undefined ? modalItem.marginPercent + '%' : '0%'"
                               class="w-full h-10 px-3 bg-gray-100/80 border border-gray-200 rounded-xl text-xs font-bold text-emerald-700 outline-none cursor-default shadow-2xs select-none">
                    </div>
                </div>

                <!-- Total Estimasi -->
                <div class="p-3 bg-emerald-50/60 rounded-xl border border-emerald-100 flex items-center justify-between text-xs">
                    <span class="font-semibold text-emerald-800">Total Harga Item</span>
                    <span class="font-extrabold text-[#0b595b] text-sm"
                          x-text="'Rp ' + ((modalItem.qty || 0) * (modalItem.buyPrice || 0)).toLocaleString('id-ID')"></span>
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="px-6 py-3.5 bg-gray-50/70 border-t border-gray-100 flex items-center justify-between gap-2">
                <button type="button" x-show="modalMode === 'edit'" @click="deleteEditingItem()"
                        class="text-xs font-bold text-red-600 hover:text-red-700 hover:bg-red-50 px-3 py-2 rounded-xl transition">
                    Hapus Item
                </button>
                <div class="flex items-center gap-2 ml-auto">
                    <button type="button" @click="itemModalOpen = false"
                            class="px-4 py-2 rounded-xl border border-gray-300 text-xs font-bold text-gray-700 hover:bg-gray-100 transition">
                        Batal
                    </button>
                    <button type="button" @click="saveModalItem()"
                            class="px-5 py-2 rounded-xl bg-[#0b595b] hover:bg-[#08484a] text-white text-xs font-bold shadow-sm transition">
                        Simpan Item
                    </button>
                </div>
            </div>

        </div>

    </div>

    <!-- ======================================================== -->
    <!-- MODAL KONFIRMASI: SELESAIKAN TRANSAKSI                   -->
    <!-- ======================================================== -->
    <div x-show="confirmModalOpen" class="fixed inset-0 z-[130] flex items-center justify-center p-4" x-cloak>
        <!-- Backdrop -->
        <div x-show="confirmModalOpen"
             x-transition:enter="transition-opacity ease-out duration-200"
             x-transition:enter-start="opacity-0"
             x-transition:enter-end="opacity-100"
             x-transition:leave="transition-opacity ease-in duration-150"
             x-transition:leave-start="opacity-100"
             x-transition:leave-end="opacity-0"
             @click="confirmModalOpen = false"
             class="absolute inset-0 bg-black/50 backdrop-blur-xs"></div>

        <!-- Modal Card -->
        <div x-show="confirmModalOpen"
             x-transition:enter="transition ease-out duration-200"
             x-transition:enter-start="opacity-0 scale-90 translate-y-3"
             x-transition:enter-end="opacity-100 scale-100 translate-y-0"
             x-transition:leave="transition ease-in duration-150"
             x-transition:leave-start="opacity-100 scale-100"
             x-transition:leave-end="opacity-0 scale-90 translate-y-3"
             @click.outside="confirmModalOpen = false"
             class="relative z-10 bg-white rounded-3xl shadow-2xl border border-gray-100 w-full max-w-sm overflow-hidden p-6 text-center">
            
            <!-- Judul & Pesan Sesuai Instruksi User -->
            <h4 class="text-base font-bold text-gray-900 mb-1.5">Selesaikan Transaksi?</h4>
            <p class="text-xs text-gray-500 leading-relaxed mb-4">
                Apakah transaksi sudah sesuai dan<br>tidak ada tambahan lagi?
            </p>

            <!-- Ringkasan Singkat Transaksi -->
            <div class="bg-gray-50 rounded-2xl p-3.5 border border-gray-100 mb-5 text-left text-xs space-y-1.5">
                <div class="flex items-center justify-between">
                    <span class="text-gray-500 font-medium">Cabang Tujuan</span>
                    <span class="font-bold text-gray-800 truncate max-w-[170px]" x-text="form.targetBranch"></span>
                </div>
                <div class="flex items-center justify-between">
                    <span class="text-gray-500 font-medium">Jumlah Item</span>
                    <span class="font-bold text-gray-800" x-text="(form.items.length).toFixed(2).replace('.', ',')"></span>
                </div>
                <div class="flex items-center justify-between pt-1.5 border-t border-gray-200/60">
                    <span class="font-semibold text-gray-700">Total Belanja</span>
                    <span class="font-extrabold text-[#0b595b] text-sm" x-text="'Rp ' + calculateGrandTotal().toLocaleString('id-ID')"></span>
                </div>
            </div>

            <!-- 2 Tombol Aksi: Batal & Selesaikan Sesuai Instruksi User -->
            <div class="flex items-center gap-2.5">
                <button type="button" @click="confirmModalOpen = false"
                        class="flex-1 h-10 rounded-xl border border-gray-200 text-xs font-bold text-gray-700 hover:bg-gray-50 active:scale-95 transition">
                    Batal
                </button>
                <button type="button" @click="executeSubmitPengadaan()"
                        class="flex-1 h-10 rounded-xl bg-[#0b595b] hover:bg-[#08484a] text-white text-xs font-bold shadow-md shadow-[#0b595b]/20 active:scale-95 transition flex items-center justify-center">
                    Selesaikan
                </button>
            </div>
        </div>
    </div>

</body>
</html>
